name: Music Assistant Lab
version: 0.0.0
slug: music_assistant_lab
description: Music Assistant server built from the music-assistant-lab fork
url: https://github.com/jiahao1553/music-assistant-lab
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant
panel_admin: false
init: false
image: ghcr.io/jiahao1553/music-assistant-lab:latest
tmpfs: true
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
stage: experimental
