name: Sync upstream release

# Once a month, set the Home Assistant add-on version on feat/ytmusic_dlp to the
# latest music-assistant/server release and open a pull request. main is not changed.

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/ytmusic_dlp
          fetch-depth: 0

      - name: Set add-on version and open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          tag=$(gh release view --repo music-assistant/server --json tagName --jq .tagName)
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/music-assistant-lab:${tag}"
          echo "Upstream release ${tag}"

          git fetch origin feat/ytmusic_dlp
          git fetch origin main
          git checkout -B feat/ytmusic_dlp origin/feat/ytmusic_dlp

          python3 - music_assistant_lab/config.yaml "$tag" "$image" <<'PY'
          import sys
          from pathlib import Path

          path, version, image = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          if not path.exists():
              raise SystemExit(f"missing {path}")
          lines = []
          for line in path.read_text().splitlines(keepends=True):
              if line.startswith("version:"):
                  lines.append(f"version: {version}\n")
              elif line.startswith("image:"):
                  lines.append(f"image: {image}\n")
              else:
                  lines.append(line)
          path.write_text("".join(lines))
          PY
          git add music_assistant_lab/config.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Set add-on version to upstream release ${tag}"
            git push origin HEAD:feat/ytmusic_dlp
          fi

          if git merge-base --is-ancestor HEAD origin/main; then
            echo "feat/ytmusic_dlp is already contained in main."
            exit 0
          fi

          existing=$(gh pr list --base main --head feat/ytmusic_dlp --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Pull request #${existing} already open."
            exit 0
          fi

          body_file=$(mktemp)
          cat > "$body_file" <<EOF
          Updates the add-on version on \`feat/ytmusic_dlp\` to music-assistant/server \`${tag}\`.

          This workflow does not change \`main\`. Sync \`main\` yourself, then close this pull request.
          EOF
          gh pr create \
            --base main \
            --head feat/ytmusic_dlp \
            --title "Set add-on version to upstream ${tag}" \
            --body-file "$body_file"
