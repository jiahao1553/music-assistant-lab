name: Sync upstream dev

# Merges music-assistant/server dev into this fork's main and opens a pull request.
# The ytmusic_dlp provider stays because this is a merge, not a branch reset.
# requirements_all.txt is regenerated from provider manifests after the merge, so the
# yt-dlp pin in music_assistant/providers/ytmusic_dlp/manifest.json is reapplied
# without hand-merging that generated file.

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream dev
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/music-assistant/server.git
          git fetch upstream dev
          git fetch origin main
          git fetch origin sync/upstream-dev || true
          git checkout -B sync/upstream-dev origin/main

          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "Fork main already contains upstream dev."
            echo "open_pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          git merge upstream/dev --no-edit
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U
            if git diff --name-only --diff-filter=U | grep -qx 'requirements_all.txt'; then
              git checkout --ours -- requirements_all.txt
              git add requirements_all.txt
            fi
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "Conflicts remain outside requirements_all.txt. Resolve them locally on sync/upstream-dev."
              exit 1
            fi
            git commit -m "Merge upstream dev"
          fi

          python3 scripts/gen_requirements_all.py
          git add requirements_all.txt
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate requirements_all.txt from provider manifests"
          fi

          if git rev-parse --verify --quiet refs/remotes/origin/sync/upstream-dev >/dev/null; then
            git push --force-with-lease origin sync/upstream-dev
          else
            git push -u origin sync/upstream-dev
          fi
          echo "open_pr=true" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.sync.outputs.open_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base main --head sync/upstream-dev --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Pull request #$existing already open."
            exit 0
          fi
          body_file=$(mktemp)
          cat > "$body_file" <<'EOF'
          Monthly merge of `music-assistant/server` `dev` into this fork.

          The `ytmusic_dlp` provider stays on this branch. `requirements_all.txt` was regenerated from provider manifests, including the `yt-dlp` pin in `music_assistant/providers/ytmusic_dlp/manifest.json`.

          After merging, rebuild and run this fork's server image. The official Home Assistant add-on tracks `ghcr.io/music-assistant/server` and will not include this plugin.
          EOF
          gh pr create \
            --base main \
            --head sync/upstream-dev \
            --title "Sync upstream dev" \
            --body-file "$body_file"
